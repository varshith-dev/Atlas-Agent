services:
  frontend:
    build: ./frontend
    container_name: atlas_frontend
    restart: always
    networks:
      - atlas_network

  backend:
    build: ./backend
    container_name: atlas_backend
    restart: always
    environment:
      - POSTGRES_URL=postgresql://atlas:atlas_secret@postgres:5432/atlas
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - atlas_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas_postgres
    restart: always
    environment:
      - POSTGRES_USER=atlas
      - POSTGRES_PASSWORD=atlas_secret
      - POSTGRES_DB=atlas
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
    networks:
      - atlas_network

  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: always
    volumes:
      - atlas_redis_data:/data
    networks:
      - atlas_network

  nginx:
    image: nginx:alpine
    container_name: atlas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - atlas_network

networks:
  atlas_network:
    driver: bridge

volumes:
  atlas_pg_data:
  atlas_redis_data:
