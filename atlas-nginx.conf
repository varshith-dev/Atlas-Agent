server {
    listen 80;
    listen [::]:80;
    server_name atlas.oqens.me;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name atlas.oqens.me;

    ssl_certificate     /etc/letsencrypt/live/atlas.oqens.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atlas.oqens.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /var/www/atlas;
    index index.html;

    # API + SSE streaming
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: serve static, fall back to index.html for client-side routes (/chat, /settings, ...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
